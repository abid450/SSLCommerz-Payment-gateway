<!-- templates/payment/checkout.html -->
<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Checkout</title>
    <style>
        /* ===================== RESET ===================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* ===================== CONTAINER ===================== */
        .checkout-container {
            max-width: 520px;
            width: 100%;
            background: #ffffff;
            border-radius: 24px;
            padding: 40px 35px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.12);
            transition: all 0.3s ease;
        }

        /* ===================== HEADER ===================== */
        .checkout-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .checkout-header .icon {
            font-size: 48px;
            margin-bottom: 8px;
        }

        .checkout-header h1 {
            font-size: 26px;
            font-weight: 700;
            color: #1e293b;
            letter-spacing: -0.5px;
        }

        .checkout-header p {
            color: #64748b;
            font-size: 14px;
            margin-top: 4px;
        }

        /* ===================== FORM ===================== */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }

        .form-group label .required {
            color: #ef4444;
            margin-left: 2px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid #e2e8f0;
            border-radius: 12px;
            font-size: 15px;
            font-family: inherit;
            color: #1e293b;
            background: #f8fafc;
            transition: all 0.25s ease;
            outline: none;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            border-color: #6366f1;
            background: #ffffff;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: #94a3b8;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 70px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        /* ===================== AMOUNT FIELD ===================== */
        .amount-field {
            position: relative;
        }

        .amount-field .currency-symbol {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
            font-weight: 700;
            color: #6366f1;
        }

        .amount-field input {
            padding-left: 44px !important;
            font-size: 22px !important;
            font-weight: 600;
            color: #1e293b;
        }

        .amount-field input:focus {
            border-color: #6366f1;
        }

        .amount-presets {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .amount-preset {
            padding: 6px 16px;
            border: 1.5px solid #e2e8f0;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            color: #475569;
            background: #f8fafc;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .amount-preset:hover {
            border-color: #6366f1;
            background: #eef2ff;
            color: #6366f1;
        }

        .amount-preset.active {
            border-color: #6366f1;
            background: #eef2ff;
            color: #6366f1;
        }

        /* ===================== PAYMENT METHODS ===================== */
        .payment-methods {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin: 6px 0 4px;
        }

        .payment-method {
            padding: 12px 6px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s ease;
            background: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .payment-method:hover {
            border-color: #a5b4fc;
            background: #f1f5f9;
        }

        .payment-method.selected {
            border-color: #6366f1;
            background: #eef2ff;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
        }

        .payment-method .method-icon {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            background: #f1f5f9;
            transition: all 0.3s ease;
        }

        .payment-method.selected .method-icon {
            background: #e0e7ff;
        }

        .payment-method .method-icon svg {
            width: 32px;
            height: 32px;
        }

        .payment-method .method-name {
            font-size: 11px;
            font-weight: 600;
            color: #334155;
            margin-top: 2px;
        }

        /* Brand Colors */
        .payment-method[data-method="bkash"] .method-icon { background: #e63946; }
        .payment-method[data-method="bkash"] .method-icon svg { fill: #ffffff; }
        .payment-method[data-method="bkash"].selected .method-icon { background: #c62828; }

        .payment-method[data-method="nagad"] .method-icon { background: #f57c00; }
        .payment-method[data-method="nagad"] .method-icon svg { fill: #ffffff; }
        .payment-method[data-method="nagad"].selected .method-icon { background: #e65100; }

        .payment-method[data-method="rocket"] .method-icon { background: #2e7d32; }
        .payment-method[data-method="rocket"] .method-icon svg { fill: #ffffff; }
        .payment-method[data-method="rocket"].selected .method-icon { background: #1b5e20; }

        .payment-method[data-method="card"] .method-icon { background: #1a237e; }
        .payment-method[data-method="card"] .method-icon svg { fill: #ffffff; }
        .payment-method[data-method="card"].selected .method-icon { background: #0d1442; }

        /* ===================== TERMS ===================== */
        .terms {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            margin: 22px 0 26px;
        }

        .terms input[type="checkbox"] {
            width: 18px;
            height: 18px;
            min-width: 18px;
            margin-top: 2px;
            accent-color: #6366f1;
            cursor: pointer;
        }

        .terms label {
            font-size: 13px;
            color: #475569;
            line-height: 1.5;
            cursor: pointer;
        }

        .terms label a {
            color: #6366f1;
            text-decoration: none;
            font-weight: 500;
        }

        .terms label a:hover {
            text-decoration: underline;
        }

        /* ===================== BUTTON ===================== */
        .btn-submit {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: #ffffff;
            border: none;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(99, 102, 241, 0.35);
        }

        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        /* ===================== LOADING ===================== */
        .loading {
            display: none;
            text-align: center;
            margin-top: 18px;
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e2e8f0;
            border-top-color: #6366f1;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading p {
            color: #64748b;
            font-size: 14px;
        }

        /* ===================== MESSAGES ===================== */
        .message {
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 18px;
            display: none;
        }

        .message.error {
            background: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
            display: block;
        }

        .message.success {
            background: #f0fdf4;
            color: #16a34a;
            border: 1px solid #bbf7d0;
            display: block;
        }

        /* ===================== SECURITY BADGE ===================== */
        .security-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 24px;
            font-size: 13px;
            color: #94a3b8;
        }

        .security-badge .lock {
            font-size: 16px;
        }

        /* ===================== RESPONSIVE ===================== */
        @media (max-width: 500px) {
            .checkout-container {
                padding: 28px 20px;
            }
            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }
            .payment-methods {
                grid-template-columns: repeat(2, 1fr);
            }
            .checkout-header h1 {
                font-size: 22px;
            }
            .btn-submit {
                font-size: 16px;
                padding: 14px;
            }
            .payment-method .method-icon {
                width: 40px;
                height: 40px;
            }
            .payment-method .method-icon svg {
                width: 26px;
                height: 26px;
            }
            .amount-field input {
                font-size: 18px !important;
            }
        }

        @media (max-width: 380px) {
            .payment-methods {
                grid-template-columns: 1fr 1fr;
            }
        }

        /* ===== VALIDATION STATES ===== */

        /* ❌ Invalid State - Red Border + Red Text */
        .form-group input.is-invalid,
        .form-group textarea.is-invalid,
        .form-group select.is-invalid {
            border-color: #dc2626 !important;
            background: #fef2f2 !important;
            box-shadow: 0 0 0 4px rgba(220, 38, 38, 0.1) !important;
        }

        /* ✅ Valid State - Green Border */
        .form-group input.is-valid,
        .form-group textarea.is-valid,
        .form-group select.is-valid {
            border-color: #22c55e !important;
            background: #f0fdf4 !important;
            box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.1) !important;
        }

        /* 🔴 Error Text - Red Color */
        .form-group .error-text {
            display: none;
            color: #dc2626 !important;
            font-size: 13px;
            font-weight: 500;
            margin-top: 6px;
            padding-left: 4px;
        }

        .form-group .error-text.show {
            display: block !important;
        }

        /* 🔴 General Error Message */
        #generalError {
            display: none;
            background: #fef2f2;
            color: #dc2626 !important;
            border: 1.5px solid #dc2626;
            padding: 14px 18px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 20px;
        }

        #generalError.show {
            display: block !important;
        }

        /* Field-specific error container */
        .field-error {
            display: none;
            color: #dc2626 !important;
            font-size: 13px;
            font-weight: 500;
            margin-top: 4px;
        }

        .field-error.show {
            display: block !important;
        }
    </style>
</head>
<body>

    <div class="checkout-container">

        <!-- ========================================== -->
        <!-- HEADER -->
        <!-- ========================================== -->
        <div class="checkout-header">
            <div class="icon">💳</div>
            <h1>Secure Checkout</h1>
            <p>Complete your payment safely &amp; quickly</p>
        </div>

        <!-- ===== ERROR DISPLAY AREA ===== -->
        <div id="generalError" class="message error"></div>

        <!-- ========================================== -->
        <!-- FORM -->
        <!-- ========================================== -->
        <form id="paymentForm" novalidate>
            {% csrf_token %}

            <!-- ========== PAYMENT METHOD ========== -->
            <div class="form-group">
                <label>Payment Method <span class="required">*</span></label>
                <div class="payment-methods">
                    <div class="payment-method" data-method="cod">
                        <img src="/static/images/devit.webp" alt="COD" width="80">
                        <span class="method-name">COD</span>
                    </div>
                    <div class="payment-method" data-method="bkash">
                        <img src="/static/images/bkash.jpg" alt="bKash" width="65">
                        <span class="method-name">bKash</span>
                    </div>
                    <div class="payment-method" data-method="nagad">
                        <img src="/static/images/nagad.webp" alt="Nagad" width="100">
                        <span class="method-name">Nagad</span>
                    </div>
                    <div class="payment-method" data-method="card">
                        <img src="/static/images/rk.webp" alt="Card" width="66">
                        <span class="method-name">Card</span>
                    </div>
                </div>
                <div class="error-text" id="paymentFieldError"></div>
            </div>

            <!-- ========== AMOUNT ========== -->
            <div class="form-group">
                <label>Amount <span class="required">*</span></label>
                <div class="amount-field">
                    <span class="currency-symbol">৳</span>
                    <input type="number" id="amount" name="amount" value="500" min="1" step="1">
                    <div class="error-text" id="amountFieldError"></div>

                </div>
                <div class="amount-presets">
                    <span class="amount-preset" data-value="100">100</span>
                    <span class="amount-preset active" data-value="500">500</span>
                    <span class="amount-preset" data-value="1000">1,000</span>
                    <span class="amount-preset" data-value="2000">2,000</span>
                    <span class="amount-preset" data-value="5000">5,000</span>
                </div>
            </div>

            <!-- ========== FULL NAME ========== -->
            <div class="form-group">
                <label>Full Name <span class="required">*</span></label>
                <input type="text" id="customer_name" placeholder="Enter your full name">
                <div class="error-text" id="nameFieldError"></div>
            </div>

            <!-- ========== EMAIL + PHONE ========== -->
            <div class="form-row">
                <div class="form-group">
                    <label>Email Address <span class="required">*</span></label>
                    <input type="email" id="customer_email" placeholder="you@example.com">
                    <div class="error-text" id="emailFieldError"></div>
                </div>
                <div class="form-group">
                    <label>Phone Number <span class="required">*</span></label>
                    <input type="tel" id="customer_phone" placeholder="017XXXXXXXX">
                    <div class="error-text" id="phoneFieldError"></div>
                </div>
            </div>

            <!-- ========== ADDRESS ========== -->
            <div class="form-group">
                <label>Shipping Address</label>
                <textarea id="customer_address" rows="2" placeholder="House, Road, Area, City"></textarea>
                <div class="error-text" id="addressFieldError"></div>
            </div>

            <!-- ========== CITY ========== -->
            <div class="form-group">
                <label>City</label>
                <input type="text" id="customer_city" placeholder="Dhaka">
                <div class="error-text" id="cityFieldError"></div>
            </div>

            <!-- ========== ORDER NOTES ========== -->
            <div class="form-group">
                <label>Order Notes <span style="font-weight:400;color:#94a3b8;">(optional)</span></label>
                <textarea id="order_notes" rows="2" placeholder="Special delivery instructions..."></textarea>
            </div>

            <!-- ========== SUBMIT ========== -->
            <button type="submit" class="btn-submit" id="submitBtn">
                Pay Now
            </button>

        </form>

        <!-- ========================================== -->
        <!-- LOADING -->
        <!-- ========================================== -->
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>Processing your payment...</p>
        </div>

        <!-- ========================================== -->
        <!-- SECURITY BADGE -->
        <!-- ========================================== -->
        <div class="security-badge">
            <span class="lock">🔒</span>
            <span>Your information is secure &amp; encrypted</span>
        </div>

    </div>

    <!-- ========================================== -->
    <!-- JAVASCRIPT -->
    <!-- ========================================== -->
    <script>
        // ============================================
        // CSRF TOKEN
        // ============================================
        function getCookie(name) {
            let value = null;
            if (document.cookie && document.cookie !== '') {
                document.cookie.split(';').forEach(c => {
                    const trimmed = c.trim();
                    if (trimmed.startsWith(name + '=')) {
                        value = decodeURIComponent(trimmed.substring(name.length + 1));
                    }
                });
            }
            return value;
        }

        // ============================================
        // AMOUNT PRESETS
        // ============================================
        document.querySelectorAll('.amount-preset').forEach(preset => {
            preset.addEventListener('click', function() {
                document.querySelectorAll('.amount-preset').forEach(p => p.classList.remove('active'));
                this.classList.add('active');
                document.getElementById('amount').value = this.dataset.value;
            });
        });

        document.getElementById('amount').addEventListener('input', function() {
            document.querySelectorAll('.amount-preset').forEach(p => p.classList.remove('active'));
        });

        // ============================================
        // PAYMENT METHOD SELECTION
        // ============================================
        document.querySelectorAll('.payment-method').forEach(el => {
            el.addEventListener('click', function() {
                document.querySelectorAll('.payment-method').forEach(m => m.classList.remove('selected'));
                this.classList.add('selected');
            });
        });

        // ============================================
        // CLEAR ALL ERRORS
        // ============================================
        function clearFieldErrors() {
            document.querySelectorAll('.form-group input, .form-group textarea').forEach(input => {
                input.classList.remove('is-invalid', 'is-valid');
            });
            document.querySelectorAll('.error-text').forEach(el => {
                el.textContent = '';
                el.classList.remove('show');
            });
            const generalError = document.getElementById('generalError');
            generalError.textContent = '';
            generalError.style.display = 'none';
        }

        // ============================================
        // FORM SUBMIT - Serializer Validation Handle
        // ============================================
        document.getElementById('paymentForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            // Clear previous errors
            clearFieldErrors();

            // Get payment method
            const selected = document.querySelector('.payment-method.selected');
            const paymentMethod = selected ? selected.dataset.method : 'card';

            // Prepare data
            const payload = {
                amount: document.getElementById('amount').value,
                customer_name: document.getElementById('customer_name').value.trim(),
                customer_email: document.getElementById('customer_email').value.trim(),
                customer_phone: document.getElementById('customer_phone').value.trim(),
                customer_address: document.getElementById('customer_address').value.trim(),
                customer_city: document.getElementById('customer_city').value.trim(),
                payment_method: paymentMethod,
            };

            console.log('📦 Sending:', payload);

            // Show loading
            const btn = document.getElementById('submitBtn');
            const loading = document.getElementById('loading');
            btn.disabled = true;
            btn.textContent = 'Processing...';
            loading.style.display = 'block';

            try {
                const response = await fetch('/payment/api/initiate/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken'),
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();
                console.log('📦 Response:', data);

                if (data.status === 'success') {
                    window.location.href = data.data.gateway_url;
                } else {
                    // ❌ Show validation errors from serializer
                    btn.disabled = false;
                    btn.textContent = 'Pay Now';
                    loading.style.display = 'none';

                    if (data.errors) {
                        // Field mapping: backend field -> frontend element ID
                        const fieldMapping = {
                            'amount': 'amountFieldError',
                            'customer_name': 'nameFieldError',
                            'customer_email': 'emailFieldError',
                            'customer_phone': 'phoneFieldError',
                            'payment_method': 'paymentFieldError',
                            'customer_address' : 'addressFieldError',
                            'customer_city' : 'cityFieldError',

                        };

                        let hasError = false;

                        // Show field-specific errors
                        for (const [backendField, frontendId] of Object.entries(fieldMapping)) {
                            if (data.errors[backendField]) {
                                const messages = Array.isArray(data.errors[backendField]) 
                                    ? data.errors[backendField].join(', ') 
                                    : data.errors[backendField];

                                const field = document.getElementById(backendField);
                                const errorEl = document.getElementById(frontendId);

                                if (field) {
                                    field.classList.add('is-invalid');
                                    field.classList.remove('is-valid');
                                }
                                if (errorEl) {
                                    errorEl.textContent = messages;
                                    errorEl.classList.add('show');
                                }
                                hasError = true;
                            }
                        }

                        // General/non-field errors
                        if (data.errors.non_field_errors) {
                            const generalMsg = Array.isArray(data.errors.non_field_errors) 
                                ? data.errors.non_field_errors.join(', ') 
                                : data.errors.non_field_errors;
                            document.getElementById('generalError').textContent = generalMsg;
                            document.getElementById('generalError').style.display = 'block';
                            hasError = true;
                        }

                        if (!hasError && data.message) {
                            document.getElementById('generalError').textContent = data.message;
                            document.getElementById('generalError').style.display = 'block';
                        }
                    } else {
                        document.getElementById('generalError').textContent = data.message || 'Payment failed. Please try again.';
                        document.getElementById('generalError').style.display = 'block';
                    }
                }
            } catch (error) {
                console.error('❌ Error:', error);
                btn.disabled = false;
                btn.textContent = 'Pay Now';
                loading.style.display = 'none';
                document.getElementById('generalError').textContent = 'Network error. Please try again.';
                document.getElementById('generalError').style.display = 'block';
            }
        });
    </script>

</body>
</html>
